instructions: |
  This repository contains a Python/Tkinter color clicker for browser games.
  Use Win-main.py on Windows and Linux-main.py on Linux or macOS.
  Install dependencies from requirements.txt before running either entry point.
  Preserve the existing safety checks and do not add automation that bypasses
  a game's rules or terms of service.

scripts:
  - name: Setup dependencies
    command: python -m pip install -r requirements.txt
    triggers:
      - session.create

automation:
  auto_issue_session: true
  remote_control: false
